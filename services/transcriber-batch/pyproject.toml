[project]
name = "panakoes-transcriber-batch"
version = "0.1.0"
description = "AWS Batch GPU worker that transcribes audio with Whisper-large-v3 fp16"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Phil LaFayette", email = "plafaydev@gmail.com" },
]
# Runtime dependency notes:
#
#   - `openai-whisper` is bundled IN the container (since 2026-05-20).
#     Earlier the container expected a custom AMI to provide whisper +
#     CUDA via a host-mounted site-packages dir; that AMI was never
#     baked end-to-end. The container is now self-contained: torch's
#     CUDA wheels bring the runtime, openai-whisper auto-downloads
#     the large-v3 fp16 weights on first run to /tmp/whisper-cache.
#     A future custom AMI may pre-bake the weights to skip the
#     ~30 s first-run model download; the code path honors MODEL_PATH
#     when set and the file exists.
#   - `torch` is pinned to a CUDA-12.4 wheel via the cu124 PyTorch
#     index; pulled by openai-whisper as a transitive dep.
#   - boto3 covers S3 (download audio, upload transcript) and
#     DynamoDB (ingestion + streaming-sessions row updates).
#   - panakoes-* libs are path-deps that the container Dockerfile
#     mirrors into the image at /workspace/<lib>.
dependencies = [
    "boto3>=1.35",
    "structlog>=24.4",
    "tenacity>=9.0",
    "openai-whisper>=20240930",
    "torch>=2.5",
    "panakoes-models",
    "panakoes-otel",
    "panakoes-audit",
    "panakoes-transcriber",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
panakoes-models = { path = "../models-lib", editable = true }
panakoes-otel = { path = "../otel-lib", editable = true }
panakoes-audit = { path = "../audit-lib", editable = true }
panakoes-transcriber = { path = "../transcriber-lib", editable = true }
torch = { index = "pytorch-cu124" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "moto[s3,dynamodb]>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "boto3-stubs[s3,dynamodb]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panakoes_transcriber_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: fast in-process tests with no external dependencies",
    "integration: tests requiring testcontainers or moto fixtures",
    "slow: tests that take more than 1 second",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '^\s*\.\.\.\s*$',
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "S",
    "ASYNC",
    "T20",
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["panakoes_otel", "panakoes_otel.*", "panakoes_audit", "panakoes_audit.*", "whisper", "whisper.*"]
ignore_missing_imports = true
