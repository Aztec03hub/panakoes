[project]
name = "panakoes-transcriber-stream"
version = "0.1.0"
description = "GPU-side streaming transcription container (faster-whisper-large + LocalAgreement-2)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Phil LaFayette", email = "plafaydev@gmail.com" },
]
# Runtime dependency notes:
#
#   - ``faster-whisper`` is the GPU inference engine. CTranslate2 (its
#     backend) bundles the CUDA runtime in the wheel.
#   - ``librosa`` is a runtime dep, not just an AMI binary; the
#     vendored ``warmup_asr`` uses it to decode the 1 s warmup WAV.
#     (Adversarial round-5 NIT-03.)
#   - ``onnxruntime`` is needed by the vendored Silero VAD iterator.
#   - ``soundfile`` and ``mosestokenizer`` are upstream WhisperLiveKit
#     deps for the buffer-trimming = "sentence" path; we set
#     buffer_trimming = "segment" by default so mosestokenizer is
#     only consulted if the operator changes the env var.
#   - ``boto3`` covers SQS (audio-frame queue), DynamoDB (session row),
#     S3 (final transcripts), and apigatewaymanagementapi
#     (PostToConnection downstream emit).
dependencies = [
    "boto3>=1.35",
    "faster-whisper>=1.2",
    "librosa>=0.10",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "soundfile>=0.12",
    "structlog>=24.4",
    "torch>=2.5",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "moto[s3,dynamodb,sqs]>=5.0",
    "ruff>=0.7",
    "boto3-stubs[s3,dynamodb,sqs]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panakoes_transcriber_stream"]

[tool.hatch.build.targets.wheel.force-include]
"src/panakoes_transcriber_stream/vendor/whisperlivekit/silero_vad_models/silero_vad_16k_op15.onnx" = "panakoes_transcriber_stream/vendor/whisperlivekit/silero_vad_models/silero_vad_16k_op15.onnx"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/panakoes_transcriber_stream",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: fast in-process tests with no external dependencies",
    "integration: tests requiring moto fixtures",
    "slow: tests that take more than 1 second",
]

[tool.coverage.run]
source = ["src/panakoes_transcriber_stream"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    # Vendor lift is upstream code (Apache-2.0); coverage gate measures
    # the wrapper, not the vendored library. The vendor NOTICE drift
    # test still asserts attribution discipline against this subtree.
    "*/vendor/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '^\s*\.\.\.\s*$',
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/panakoes_transcriber_stream/vendor"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "S",
    "ASYNC",
    "T20",
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S105", "S106"]
