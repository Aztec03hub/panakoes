[project]
name = "panakoes-cost-rollup-aggregator"
version = "0.1.0"
description = "Nightly Lambda that populates panakoes-dev-tenant-cost-rollup from AWS Cost Explorer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Phil LaFayette", email = "plafaydev@gmail.com" },
]
dependencies = [
    "boto3>=1.35",
    "structlog>=24.4",
    "panakoes-cost-api",
]

[tool.uv.sources]
panakoes-cost-api = { path = "../cost-api", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "moto[dynamodb]>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "boto3-stubs[dynamodb,ce]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panakoes_cost_rollup_aggregator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: fast in-process tests with no external dependencies",
    "integration: tests requiring testcontainers or moto fixtures",
    "slow: tests that take more than 1 second",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "S",
    "T20",
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# `panakoes_cost_api` is a sibling editable install. mypy's strict mode
# can flake on its FastAPI / pydantic re-exports when resolving from a
# different working tree; we only consume one stable type
# (`TenantRollupStore`) so loosening the import check is safe and keeps
# the boundary surface narrow.
[[tool.mypy.overrides]]
module = ["panakoes_cost_api", "panakoes_cost_api.*"]
ignore_missing_imports = true
