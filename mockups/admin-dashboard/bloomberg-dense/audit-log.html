const actionChip = (a) => {
  if (a.endsWith('.success')) return '<span class="chip ok">SUCCESS</span>';
  if (a.endsWith('.failed'))  return '<span class="chip err">FAILED</span>';
  if (a.endsWith('.attempt')) return '<span class="chip info">ATTEMPT</span>';
  return '<span class="chip mute">'+a+'</span>';
};
const t3Chip = (t3) => {
  if (!t3) return '';
  const colors = {
    'terminate-session': 'warn',
    'force-fail-ingestion': 'warn',
    'block-user-sessions': 'err',
  };
  return `<span class="chip ${colors[t3] || 'mute'}">${t3}</span>`;
};
const payloadSummary = (p) => Object.entries(p).map(([k,v]) => {
  let val;
  if (typeof v === 'string') val = v;
  else if (Array.isArray(v)) val = '[' + v.length + ']';
  else val = JSON.stringify(v);
  if (val.length > 36) val = val.slice(0,33)+'…';
  return `<span class="dim">${k}=</span><span class="bright">${val}</span>`;
}).join(' <span class="muted">·</span> ');

const rows = entries.map((e,i) => `

    <td class="mono" style="font-size:10px;">${e.req}</td>
    <td style="font-size:10.5px;">${payloadSummary(e.payload)}</td>

`).join('');
