# Extends the gitleaks default rule set.
# See https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
# for the upstream defaults this inherits.
[extend]
useDefault = true

# Allowlist for known-safe matches.
[allowlist]
description = "Files and patterns that should never be scanned for secrets."
paths = [
    '''(.*?)\.lock\.hcl''',  # Terraform lock files contain provider hashes that look secret-like but are public.
    '''package-lock\.json''',
    '''pnpm-lock\.yaml''',
    '''yarn\.lock''',
    '''\.github/codeql/test-fixtures/.*''',  # CodeQL custom-query fixtures contain deliberately-shaped fake secrets for the panakoes/secret-pattern-in-tf-default test cases; never real values.
    '''tests/scripts/test_verify_agent_run\.sh''',  # synthetic AWS key pair used to exercise verify-agent-run.sh's gitleaks-detection path; never a real value.
    '''\.agent-runs/.*''',  # gitignored sub-agent run reports; may contain quoted output that includes test fixtures. Never reaches the repo.
    '''mockups/.*''',  # UI mockup HTML files contain fake/placeholder data (idempotency keys, session IDs, request IDs) that trip generic-api-key; none are real secrets.
]

# Anything that matches this regex is allowed even if it looks like a secret.
regexes = [
    '''EXAMPLE_[A-Z_]+''',  # placeholder values in docs / examples
    '''AKIAIOSFODNN7EXAMPLE''',  # AWS docs example access key
    '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',  # AWS docs example secret key
    '''sk_(live|test)_abc123''',  # billing tests: deliberately-fake Stripe key fixtures used by negative-path tests asserting Settings rejects them
    '''rk_(live|test)_abc123''',  # billing tests: deliberately-fake Stripe restricted-key fixtures used by negative-path tests
    '''Aztec03hub/panakoes''',  # public repo slug appears in docs and tooling examples; never a secret. Defuses generic-api-key false positives.
    '''from-[a-z-]+-env-var-32bytes-min''',  # test fixture pattern in services/*/tests/ for JWT_SECRET env-resolution tests.
    '''panakoes-dev-auth:migrate-[0-9a-f]+''',  # Docker image tag pattern in release notes and runbooks.
]
