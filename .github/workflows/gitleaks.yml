name: gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # merge_group: re-scan the queue's merged commit so a secret that
  # only appears when two PRs combine is still caught.
  merge_group:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
