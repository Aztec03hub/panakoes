name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-services:
    name: Detect Python services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
      has-services: ${{ steps.find.outputs.has-services }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: |
          services=$(find services -maxdepth 2 -name pyproject.toml -exec dirname {} \; 2>/dev/null | sort | jq -R -s -c 'split("\n")[:-1]')
          if [ "$services" = "[]" ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
            echo "has-services=false" >> "$GITHUB_OUTPUT"
          else
            echo "services=$services" >> "$GITHUB_OUTPUT"
            echo "has-services=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test ${{ matrix.service }}
    needs: detect-services
    if: needs.detect-services.outputs.has-services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --group dev --frozen

      - name: Lint with ruff
        working-directory: ${{ matrix.service }}
        run: uv run ruff check

      - name: Type check with mypy
        working-directory: ${{ matrix.service }}
        run: uv run mypy src

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: uv run pytest

      # Sanitize service path for artifact name. GitHub disallows slashes
      # (and several other characters) in artifact names; matrix.service
      # values like "services/_template" need their slashes replaced.
      - name: Compute coverage artifact name
        id: artifact_name
        run: echo "name=coverage-$(echo '${{ matrix.service }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ matrix.service }}/coverage.xml
          retention-days: 30

  # Always-runs sentinel so this workflow reports a status even when there are
  # no services yet (so it can be added as a required check in branch protection
  # without locking up). Not tied to detect-services.
  pytest-status:
    name: Python tests gate
    runs-on: ubuntu-latest
    needs: [detect-services, test]
    if: always()
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          if [ "${{ needs.detect-services.result }}" != "success" ]; then
            echo "detect-services failed"; exit 1
          fi
          if [ "${{ needs.detect-services.outputs.has-services }}" = "true" ] && [ "${{ needs.test.result }}" != "success" ]; then
            echo "one or more service test matrices failed"; exit 1
          fi
          echo "Python tests gate passed."
