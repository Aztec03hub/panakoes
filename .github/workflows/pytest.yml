name: Python tests

on:
  workflow_dispatch:

# Cancel in-progress runs on the same PR (or branch ref for push events)
# when a new commit / event arrives. Without this, every old run sat in
# queued status holding a runner slot until it ran or naturally aged
# out, which gridlocked the GitHub Actions queue on 2026-05-08 when
# rapid close+reopen + force-push activity flooded the runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-services:
    name: Detect Python services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.scope.outputs.python_services }}
      has-services: ${{ steps.scope.outputs.python_has_changes }}
      docs-only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The detect-changed-services composite uses
          # `git diff BASE...HEAD`; that needs both sides reachable.
          # fetch-depth: 0 unconditionally gives us the merge-base
          # regardless of how deep main has moved.
          fetch-depth: 0
      - id: scope
        # On push-to-main and merge_group there is no PR diff to scope
        # against; in those contexts we want the OLD behavior (every
        # service runs) so post-merge regressions are still caught. The
        # composite's full-fan-out fallback is the safe default; we get
        # there by passing a base-ref that does not resolve on those
        # events.
        uses: ./.github/actions/detect-changed-services
        with:
          base-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'this-ref-intentionally-does-not-exist' }}

  test:
    name: Test ${{ matrix.service }}
    needs: detect-services
    if: needs.detect-services.outputs.has-services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --group dev --frozen

      - name: Lint with ruff
        working-directory: ${{ matrix.service }}
        run: uv run ruff check

      - name: Type check with mypy
        working-directory: ${{ matrix.service }}
        run: uv run mypy src

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: uv run pytest

      # Sanitize service path for artifact name. GitHub disallows slashes
      # (and several other characters) in artifact names; matrix.service
      # values like "services/_template" need their slashes replaced.
      - name: Compute coverage artifact name
        id: artifact_name
        run: echo "name=coverage-$(echo '${{ matrix.service }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ matrix.service }}/coverage.xml
          retention-days: 30

  # Always-runs sentinel so this workflow reports a status even when the
  # matrix is empty (docs-only PR, or no Python services have changed).
  # This job is the one wired into branch protection's required-checks
  # list; the per-service matrix legs are NOT individually required, so
  # we can safely skip them when nothing in their service changed.
  pytest-status:
    name: Python tests gate
    runs-on: ubuntu-latest
    needs: [detect-services, test]
    if: always()
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          if [ "${{ needs.detect-services.result }}" != "success" ]; then
            echo "detect-services failed"; exit 1
          fi
          # The matrix `test` job result is `skipped` when no Python
          # service has changed; that's the intended path-scoped
          # behavior and counts as a pass for the gate.
          if [ "${{ needs.detect-services.outputs.has-services }}" = "true" ] && [ "${{ needs.test.result }}" != "success" ]; then
            echo "one or more service test matrices failed"; exit 1
          fi
          if [ "${{ needs.detect-services.outputs.has-services }}" = "true" ]; then
            echo "Python tests gate passed (scoped matrix ran)."
          else
            echo "Python tests gate passed (no Python services changed; matrix skipped)."
          fi
