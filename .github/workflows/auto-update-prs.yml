# When main moves, every open PR is now "behind" main and ineligible to merge
# until rebased. Manually triggering "Update branch" on each PR is the
# bottleneck of our PR queue cascade. This workflow eliminates that toil:
# on every push to main, it calls the update-branch API on every open PR.
#
# The update-branch API does a server-side merge of main into the PR's branch
# (creating a "Merge branch 'main' into ..." commit on the PR's branch).
# That commit gets squash-merged away when the PR lands, so it has no impact
# on the final history.
#
# AUTH IMPORTANT: This workflow uses a fine-grained PAT (`AUTO_UPDATE_PAT`)
# rather than `secrets.GITHUB_TOKEN`. Per GitHub's anti-recursion policy,
# pushes authored by GITHUB_TOKEN do NOT trigger workflow runs. With
# GITHUB_TOKEN, the cascade silently invalidated every open PR's CI on a
# new SHA with no checks, gridlocking the queue. The PAT (which GitHub
# treats as a user-initiated event) restores the "CI re-runs on each
# updated branch" behavior the docstring claims.
#
# PAT scope: contents=R/W, pull-requests=R/W, scoped to this repo only.
# Expires every 90 days. If the queue stops draining and PRs go stale,
# check whether AUTO_UPDATE_PAT has expired before debugging anything else.
name: Auto-update PR branches

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Only one update-sweep runs at a time; if main moves twice in quick succession,
  # the second run cancels the first (the second push superseded it anyway).
  group: auto-update-prs
  cancel-in-progress: true

jobs:
  update:
    name: Update every open PR's branch
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update-branch on each open PR
        env:
          # See the AUTH IMPORTANT note in the docstring above. Do not
          # "simplify" this back to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_PAT }}
        run: |
          set -euo pipefail
          # Dependabot PRs MUST NOT be update-branched: the API's merge
          # commit counts as a foreign edit and Dependabot then refuses
          # every future `@dependabot rebase` ("edited by someone other
          # than Dependabot"), wedging the PR until a full recreate.
          # This silently froze a 17-PR bot queue 2026-06-04..06. Bots
          # get a rebase comment instead; humans get update-branch.
          gh pr list --state open --json number,author \
            -q '.[] | "\(.number) \(.author.login)"' --repo "${GITHUB_REPOSITORY}" |
          while read -r pr author; do
            echo "::group::PR #$pr ($author)"
            case "$author" in
              *dependabot*)
                gh pr comment "$pr" --body "@dependabot rebase" --repo "${GITHUB_REPOSITORY}" \
                  || echo "  rebase comment failed" ;;
              *)
                gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/$pr/update-branch" \
                  || echo "  skipped (conflicts or already up-to-date)" ;;
            esac
            echo "::endgroup::"
          done
