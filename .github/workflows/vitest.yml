name: TypeScript tests

on:
  workflow_dispatch:

# Cancel in-progress runs on the same PR (or branch ref for push events)
# when a new commit / event arrives. Without this, every old run sat in
# queued status holding a runner slot until it ran or naturally aged
# out, which gridlocked the GitHub Actions queue on 2026-05-08 when
# rapid close+reopen + force-push activity flooded the runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-services:
    name: Detect TypeScript services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.scope.outputs.typescript_services }}
      has-services: ${{ steps.scope.outputs.typescript_has_changes }}
      docs-only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        # On push-to-main and merge_group, fall back to the full matrix
        # by passing a non-resolvable base ref (see pytest.yml comment).
        uses: ./.github/actions/detect-changed-services
        with:
          base-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'this-ref-intentionally-does-not-exist' }}

  test:
    name: Test ${{ matrix.service }}
    needs: detect-services
    if: needs.detect-services.outputs.has-services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.0.8"
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        name: Cache pnpm store
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles(format('{0}/pnpm-lock.yaml', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pnpm install --frozen-lockfile

      - name: Lint with biome
        working-directory: ${{ matrix.service }}
        run: pnpm biome check

      - name: Type-check
        working-directory: ${{ matrix.service }}
        # Use per-service `typecheck` script rather than `tsc --noEmit`
        # directly. SvelteKit projects (like services/admin) need
        # `svelte-kit sync` to generate `.svelte-kit/tsconfig.json` before
        # tsc can resolve the extended base config; the per-service
        # script handles that. Plain TS services define typecheck as
        # `tsc --noEmit` so the behavior is unchanged for them.
        run: pnpm typecheck

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: pnpm vitest run --coverage

      # Production build gate. Catches defects that lint + typecheck +
      # tests miss because they all run via vitest's transform
      # (`tsconfig.json` with `noEmit: true`). The actual `pnpm build`
      # uses `tsconfig.build.json` and emits to `dist/`, which is what
      # the Docker image and `node dist/index.js` runtime depend on.
      # Skipped for services that don't define a `build` script (e.g. a
      # frontend with its own framework-native build path that already
      # runs elsewhere). Established 2026-05-10 after the auth service
      # shipped two build-blocking defects (pnpm-workspace + tsconfig
      # `.ts` imports) that CI never ran.
      - name: Production build
        working-directory: ${{ matrix.service }}
        run: |
          if jq -e '.scripts.build' package.json > /dev/null; then
            pnpm build
          else
            echo "No build script defined; skipping."
          fi

      # Sanitize service path for artifact name. GitHub disallows slashes
      # in artifact names; matrix.service values like "services/auth" need
      # their slashes replaced.
      - name: Compute coverage artifact name
        id: artifact_name
        run: echo "name=coverage-$(echo '${{ matrix.service }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ matrix.service }}/coverage/
          retention-days: 30

  # Always-runs sentinel so this workflow reports a status even when the
  # matrix is empty (docs-only PR, or no TS services have changed). This
  # job is wired into branch protection's required-checks list; the
  # per-service matrix legs are NOT individually required, so we can
  # safely skip them when nothing in their service changed.
  vitest-status:
    name: TypeScript tests gate
    runs-on: ubuntu-latest
    needs: [detect-services, test]
    if: always()
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          if [ "${{ needs.detect-services.result }}" != "success" ]; then
            echo "detect-services failed"; exit 1
          fi
          if [ "${{ needs.detect-services.outputs.has-services }}" = "true" ] && [ "${{ needs.test.result }}" != "success" ]; then
            echo "one or more service test matrices failed"; exit 1
          fi
          if [ "${{ needs.detect-services.outputs.has-services }}" = "true" ]; then
            echo "TypeScript tests gate passed (scoped matrix ran)."
          else
            echo "TypeScript tests gate passed (no TypeScript services changed; matrix skipped)."
          fi
