name: TypeScript tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # merge_group: re-run vitest against the queue's ahead-of-time merged
  # commit so a TS test regression from PR-pair interactions is caught
  # before the merge actually lands.
  merge_group:

# Cancel in-progress runs on the same PR (or branch ref for push events)
# when a new commit / event arrives. Without this, every old run sat in
# queued status holding a runner slot until it ran or naturally aged
# out, which gridlocked the GitHub Actions queue on 2026-05-08 when
# rapid close+reopen + force-push activity flooded the runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-services:
    name: Detect TypeScript services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
      has-services: ${{ steps.find.outputs.has-services }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: |
          services=$(find services -maxdepth 2 -name package.json -exec dirname {} \; 2>/dev/null | sort | jq -R -s -c 'split("\n")[:-1]')
          if [ "$services" = "[]" ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
            echo "has-services=false" >> "$GITHUB_OUTPUT"
          else
            echo "services=$services" >> "$GITHUB_OUTPUT"
            echo "has-services=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test ${{ matrix.service }}
    needs: detect-services
    if: needs.detect-services.outputs.has-services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.0.8"
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        name: Cache pnpm store
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles(format('{0}/pnpm-lock.yaml', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pnpm install --frozen-lockfile

      - name: Lint with biome
        working-directory: ${{ matrix.service }}
        run: pnpm biome check

      - name: Type-check with tsc
        working-directory: ${{ matrix.service }}
        run: pnpm tsc --noEmit

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: pnpm vitest run --coverage

      # Sanitize service path for artifact name. GitHub disallows slashes
      # in artifact names; matrix.service values like "services/auth" need
      # their slashes replaced.
      - name: Compute coverage artifact name
        id: artifact_name
        run: echo "name=coverage-$(echo '${{ matrix.service }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ matrix.service }}/coverage/
          retention-days: 30

  # Always-runs sentinel so this workflow reports a status even when there are
  # no TS services yet (so it can be added as a required check in branch
  # protection without locking up). Mirrors the `pytest-status` pattern.
  vitest-status:
    name: TypeScript tests gate
    runs-on: ubuntu-latest
    needs: [detect-services, test]
    if: always()
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          if [ "${{ needs.detect-services.result }}" != "success" ]; then
            echo "detect-services failed"; exit 1
          fi
          if [ "${{ needs.detect-services.outputs.has-services }}" = "true" ] && [ "${{ needs.test.result }}" != "success" ]; then
            echo "one or more service test matrices failed"; exit 1
          fi
          echo "TypeScript tests gate passed."
