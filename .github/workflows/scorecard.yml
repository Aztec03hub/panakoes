# OpenSSF Scorecard analysis.
#
# Runs the OpenSSF Scorecard against the repository on push to main and on
# a weekly schedule. Uploads results to GitHub code scanning as SARIF so
# findings appear in the Security tab and a public Scorecard badge can be
# rendered. Read-only by default; the only token elevations are the
# minimum required for SARIF upload and (optionally) for Branch-Protection
# probing of the public repo metadata.
name: Scorecard supply-chain security

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'  # weekly, Monday 07:23 UTC (offset to avoid GHA peak)
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload SARIF results
      id-token: write          # required for the publish_results path
      contents: read           # required for actions/checkout
      actions: read            # required to read workflow run metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repos do not need a PAT for most checks; publish_results
          # surfaces a public Scorecard badge and aggregate metrics on
          # https://securityscorecards.dev. Safe for public repos.
          publish_results: true

      - name: Upload artifact (raw SARIF)
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
