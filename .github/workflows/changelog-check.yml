name: CHANGELOG check

on:
  pull_request:
    branches: [main]
  # merge_group: pass trivially. PR-time validation already ran and
  # succeeded; re-running the gate against `merge_group` would re-fail
  # any PR that legitimately had `skip-changelog` applied at PR time
  # (the labels are not visible in merge_group context). Trusting
  # PR-time is the safe default for a queued merge.
  merge_group:

# Cancel in-progress runs on the same PR (or branch ref for push events)
# when a new commit / event arrives. Without this, every old run sat in
# queued status holding a runner slot until it ran or naturally aged
# out, which gridlocked the GitHub Actions queue on 2026-05-08 when
# rapid close+reopen + force-push activity flooded the runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Verify .changelog fragment present when code changes
    runs-on: ubuntu-latest
    # Skip the gate for Dependabot PRs (bot does not author CHANGELOG entries),
    # for any PR labeled 'dependencies' (the label Dependabot auto-applies and
    # humans can apply for manual dependency bumps), and for PRs explicitly
    # labeled 'skip-changelog' for cases where a CHANGELOG entry is genuinely
    # not warranted.
    #
    # On merge_group events, github.event.pull_request is null, so the
    # PR-field guards below evaluate trivially. We force a pass for
    # merge_group at the first step rather than letting the body run
    # against a context that has no labels.
    if: |
      github.event_name == 'merge_group' || (
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
      )
    steps:
      - name: Pass trivially on merge_group
        if: github.event_name == 'merge_group'
        run: |
          echo "merge_group event detected. CHANGELOG validation already ran at PR time. Pass."

      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changelog fragment present for source changes
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)

          NEEDS_CHANGELOG=false
          for f in $CHANGED_FILES; do
            case "$f" in
              docs/*|.github/*|.gitignore|.pre-commit-config.yaml|.gitleaks.toml|README.md|CONTRIBUTING.md|SECURITY.md|LICENSE)
                continue
                ;;
              CLAUDE.md|PLANNING.md|SCOPE.md)
                continue
                ;;
              scripts/*|Makefile|.githooks/*)
                # Dev tooling; not user-visible product surface.
                continue
                ;;
              CHANGELOG.md|.changelog/*)
                continue
                ;;
              *)
                NEEDS_CHANGELOG=true
                ;;
            esac
          done

          if [ "$NEEDS_CHANGELOG" = "true" ]; then
            # Accept either a new fragment under .changelog/ (the canonical
            # going-forward pattern) or a direct CHANGELOG.md edit (legacy
            # fallback for backports and manual touch-ups).
            if ! echo "$CHANGED_FILES" | grep -Eq '^(\.changelog/.+\.md|CHANGELOG\.md)$'; then
              echo "::error::Source code changed but no .changelog/<UTC-timestamp>-<slug>.md fragment was added (and CHANGELOG.md was not directly edited)."
              echo "::error::Drop a fragment under .changelog/ per the format in .changelog/README.md, or apply the 'skip-changelog' label if this PR genuinely does not warrant an entry."
              exit 1
            fi
          fi

          echo "CHANGELOG check passed."
