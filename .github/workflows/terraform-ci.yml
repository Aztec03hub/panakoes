# Terraform CI for Panakoes infrastructure.
#
# Runs on pull requests and pushes to main when infra/ or the workflow
# itself changes. Authenticates to AWS via OIDC (no long-lived keys),
# checks formatting, validates each Terraform configuration, and runs
# plan against the global configuration so PRs surface infra diffs
# before merge.
name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
# Note: no paths filter. Branch protection requires this workflow as a status
# check; a paths-filtered workflow that does not trigger reports no status,
# which would block merge indefinitely. Letting it run on every PR is the
# accepted tradeoff (about 2 min of CI compute when no infra changes).

permissions:
  id-token: write   # required to fetch the GitHub OIDC token
  contents: read    # required for actions/checkout

jobs:
  terraform-ci:
    name: Terraform fmt, validate, plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.7
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS auth (OIDC smoke test)
        run: aws sts get-caller-identity

      - name: Terraform fmt check (recursive)
        run: terraform fmt -check -recursive infra/

      - name: Bootstrap config (init no-backend, validate)
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Global config (init, validate, plan)
        working-directory: infra/global
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -no-color
