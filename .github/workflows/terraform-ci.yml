# Terraform CI for Panakoes infrastructure.
#
# Runs on pull requests and pushes to main when infra/ or the workflow
# itself changes. Authenticates to AWS via OIDC (no long-lived keys),
# checks formatting, validates each Terraform configuration, and runs
# plan against the global configuration so PRs surface infra diffs
# before merge.
name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # merge_group: re-validate against the queue's ahead-of-time merged
  # commit so a Terraform regression from two simultaneously-merging
  # infra PRs is caught before the merge actually lands.
  merge_group:
# Note: no paths filter. Branch protection requires this workflow as a status
# check; a paths-filtered workflow that does not trigger reports no status,
# which would block merge indefinitely. Letting it run on every PR is the
# accepted tradeoff (about 2 min of CI compute when no infra changes).

permissions:
  id-token: write   # required to fetch the GitHub OIDC token
  contents: read    # required for actions/checkout

# Serialize Terraform plans per branch. Two plans on the same branch can
# race for the DynamoDB state lock and fail with "Error acquiring the
# state lock"; we hit that early on. cancel-in-progress is FALSE because
# canceling a running plan mid-flight can leave the lock orphaned for
# up to 15 minutes (TTL on the DynamoDB lock item).
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-ci:
    name: Terraform fmt, validate, plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS auth (OIDC smoke test)
        run: aws sts get-caller-identity

      - name: Terraform fmt check (recursive)
        run: terraform fmt -check -recursive infra/

      - name: Bootstrap config (init no-backend, validate)
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Global config (init, validate, plan)
        working-directory: infra/global
        run: |
          terraform init -input=false
          terraform validate
          # -lock-timeout=2m gives a concurrent run on the same backend
          # two minutes to release the DynamoDB state lock before we fail
          # the plan. Defense alongside the workflow-level concurrency
          # group; concurrency serializes our own runs, lock-timeout
          # tolerates a stuck lock from a previous run that did not exit
          # cleanly.
          terraform plan -input=false -no-color -lock-timeout=2m
