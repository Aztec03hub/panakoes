# Server-side actionlint.
#
# Defense-in-depth on top of the actionlint pre-commit hook (added in
# PR #30). Pre-commit only runs on developers who installed the hook; this
# workflow runs against every PR and every push to main, so a broken
# workflow file cannot land via a contributor whose local hooks are
# misconfigured. Fails on any error.
name: actionlint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yml'
      - '.github/actionlint-matcher.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yml'
      - '.github/actionlint-matcher.json'
  # merge_group: lint the queue's ahead-of-time merged commit so a
  # workflow conflict between two simultaneously-merging PRs is caught
  # before the merge actually lands. No paths filter on merge_group
  # because GitHub merge queue does not support paths filtering on this
  # event; the workflow accepts the small extra cost.
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
        with:
          # Bubble matcher pretties up GitHub annotations on the PR diff.
          # Any error (severity-level: error) fails the step.
          fail_on_error: true
