# Trivy filesystem scan.
#
# Runs Aqua Security's Trivy scanner against the repository on every PR.
# Scans for vulnerable dependencies (Python, Node, Terraform providers) and
# IaC misconfigurations (Terraform, Dockerfile). Surfaces HIGH and CRITICAL
# findings only, both as a SARIF upload to GitHub code scanning and as a
# step-summary table for at-a-glance PR triage.
name: Trivy filesystem scan

on:
  pull_request:
    branches: [main]
  # merge_group: re-scan the queue's ahead-of-time merged commit so a
  # vulnerability from two simultaneously-merging dependency PRs is
  # caught before the merge actually lands.
  merge_group:

# Cancel in-progress runs on the same PR (or branch ref for push events)
# when a new commit / event arrives. Without this, every old run sat in
# queued status holding a runner slot until it ran or naturally aged
# out, which gridlocked the GitHub Actions queue on 2026-05-08 when
# rapid close+reopen + force-push activity flooded the runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # SARIF upload to code scanning

jobs:
  scan:
    name: Scan filesystem (vulns + misconfigs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'   # report-only here; gating happens via the table step
          skip-dirs: 'node_modules,.terraform,.venv'
          # billing/config.py contains a Stripe TEST-mode placeholder
          # default (a string with the test-mode prefix) enforced at
          # boot by the validator that rejects live keys. The
          # placeholder must keep the test-mode prefix to satisfy that
          # validator. Trivy's secrets scanner has no allow-list
          # mechanism that survives cleanly across both gate steps, so
          # we exclude the single config file. Vulnerability scanning
          # of a pure-config file provides nothing; the rest of
          # services/billing is still scanned. The .trivyignore file
          # is also excluded so the scanner does not recursively
          # detect rule patterns mentioned in its own ignore-comments.
          # Note: do NOT paste the literal placeholder string into
          # this comment, into .trivyignore, or into the CHANGELOG;
          # the secrets detector still scans those files and matches
          # the regex anywhere it appears.
          skip-files: 'services/billing/src/panakoes_billing/config.py,.trivyignore'
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Run Trivy filesystem scan (table, gating)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: 'node_modules,.terraform,.venv'
          # See SARIF step above for why these two files are skipped.
          skip-files: 'services/billing/src/panakoes_billing/config.py,.trivyignore'
          trivyignores: .trivyignore
