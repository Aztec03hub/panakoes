version: 2

# Why grouped updates: parallel single-dep PRs each rewrite the lockfile
# (pnpm-lock.yaml, uv.lock, etc.) against their own pre-merge view of
# main, producing textual conflicts that have no semantically correct
# manual resolution (the lockfile is a derived artifact). Grouping
# minor+patch updates into one PR per ecosystem per service per week
# eliminates this failure mode by producing exactly one lockfile-
# touching PR at a time.
#
# Major version bumps stay UNGROUPED so each gets reviewed individually
# (breaking changes deserve their own PR for diff visibility and CI).
#
# Schedule: weekly on Monday so a single CI cycle handles all the
# Dependabot output instead of trickling in throughout the week.
#
# See feedback_panakoes_lessons.md "Dependabot lockfile conflicts" for
# the incident that motivated this design.

updates:
  # ---------------------------------------------------------------------
  # GitHub Actions versions
  # ---------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------
  # Terraform providers
  # ---------------------------------------------------------------------
  - package-ecosystem: "terraform"
    directory: "/infra/bootstrap"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      tf-bootstrap-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "terraform"
    directory: "/infra/global"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      tf-global-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------
  # Python services (uv-managed pyproject.toml).
  # Dependabot's "pip" ecosystem parses pyproject.toml + uv.lock and
  # proposes dep bumps. Each service is its own update entry because
  # Dependabot's directory-per-entry model doesn't support multi-dir
  # batching natively. Within each, minor+patch are grouped.
  # ---------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/services/_template"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      template-minor-patch:
        update-types:
          - "minor"
          - "patch"

