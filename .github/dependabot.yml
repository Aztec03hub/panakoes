  # ---------------------------------------------------------------------
  # TypeScript services (npm / pnpm-lock.yaml).
  # Dependabot's npm ecosystem reads pnpm-lock.yaml. Grouping is
  # essential here because pnpm-lock.yaml conflicts on parallel
  # rewrites are exactly the failure mode this PR is designed to
  # prevent.
  # ---------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/services/auth"
